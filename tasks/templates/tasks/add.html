<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Task</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #43cea2, #185a9d);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .form-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        padding: 2rem 3rem;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        text-align: center;
        width: 90%;
        max-width: 400px;
      }

      h1 {
        margin-bottom: 1rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      input[type="text"] {
        padding: 0.8rem;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 1rem;
      }

      button {
        background: #00ffcc;
        color: #222;
        border: none;
        padding: 0.8rem;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      button:hover {
        background: #00e6b8;
      }

      a {
        color: white;
        text-decoration: none;
        margin-top: 1rem;
        display: inline-block;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="form-card">
      <h1>➕ Add New Task</h1>
      <form method="post">
        {% csrf_token %}
        <input
          type="text"
          name="task"
          placeholder="Enter your task..."
          required
        />
        <button type="submit">Add Task</button>
      </form>
      <a href="{% url 'index' %}">⬅ Back to Tasks</a>
    </div>
  </body>
</html>
